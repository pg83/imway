            python3 ./build -j "$(nproc)" -k -Druns=1 -Dshard=3/4 '-Dfilter=headless_*syncobj*' -Dtest_wrap="$PWD/dev/vng_wrap.sh" test
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Summarize failure
