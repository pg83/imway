            python3 ./build -j "$(nproc)" -k -Druns=1 -Dshard=2/4 '-Dfilter=headless_*syncobj*' -Dtest_wrap="$PWD/dev/vng_wrap.sh" test
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests.log" \
            --title "Tests 2/4" \
            --reproduce "./build -Druns=1 -Dshard=2/4 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-2-log
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-3:
    name: Tests 3/4
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

