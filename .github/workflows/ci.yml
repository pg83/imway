            --log "$RUNNER_TEMP/coverage.log" \
            --title "Coverage 3/4" \
            --reproduce "./build -B .b-cov -Druns=1 -Dshard=3/4 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-3-log
          path: ${{ runner.temp }}/coverage.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  coverage:
    name: Coverage
    needs: [coverage-0, coverage-1, coverage-2, coverage-3]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the slices' tracefiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: ${{ runner.temp }}/coverage-shards

      - name: Merge the slices' tracefiles
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/coverage-report"
          mkdir -p "$report"
          python3 dev/merge_lcov.py \
            --output "$report/coverage.info" \
            --summary "$report/summary.txt" \
            "$RUNNER_TEMP"/coverage-shards/coverage-shard-*/coverage.info
          {
            echo "## Merged coverage"
            echo
            echo '```text'
            cat "$report/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render browsable report
        run: |
          sudo apt-get install -y -qq lcov >/dev/null
          report="$RUNNER_TEMP/coverage-report"
          genhtml --branch-coverage \
            --ignore-errors inconsistent,category,count,range,source \
            --output-directory "$report/html" \
            "$report/coverage.info"

      - name: Upload browsable coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage-report/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: linux-clang
          verbose: true

  tests-asan-0:
    name: Tests ASan 0/4
    needs: [tests-0, tests-1, tests-2, tests-3]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the scenarios
        uses: ./.github/actions/prepare-tests

      - name: Run the test slice with ASan
        run: |
          set -o pipefail
          export CFLAGS="-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=address"
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export LSAN_OPTIONS="suppressions=$PWD/dev/lsan.supp"
          # lavapipe compiles shaders through LLVM on its own worker threads, whose
          # stacks asan's inflated frames overrun: the run died with a SEGV inside
          # libLLVM on a random scenario. No extra threads, no small stacks to overrun.
          export LP_NUM_THREADS=0
          {
            python3 ./build -B .b-ta -j "$(nproc)" -k -Druns=1 -Dshard=0/4 ${TEST_FILTER:+-Dfilter=$TEST_FILTER} test
          } 2>&1 | tee "$RUNNER_TEMP/tests-asan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-asan.log" \
            --title "Tests ASan 0/4" \
            --reproduce "CFLAGS/-fsanitize=address ./build -B .b-ta -Druns=1 -Dshard=0/4 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-0-log
          path: ${{ runner.temp }}/tests-asan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

