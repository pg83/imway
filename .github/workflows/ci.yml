name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Build imway
        run: |
          set -o pipefail
          python3 ./build -j "$(nproc)" imway \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build.log" \
            --title "Build" \
            --reproduce "./build imway"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the test environment
        run: |
          # nested user namespaces for the sndio scenario's private /var/run
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # dmabuf test buffers come from udmabuf (built into the azure
          # kernel; modprobe is the fallback for modular kernels)
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          [ -e /dev/udmabuf ] || {
            echo "no udmabuf device; kernel config:"
            grep -i udmabuf "/boot/config-$(uname -r)" || true
            exit 1
          }
          sudo chmod 666 /dev/udmabuf
          # a render node backs dmabuf fd validation and the KMS emulator's
          # companion identity; the GPU-less runner gets one from vgem
          [ -e /dev/dri ] || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vgem
          }
          ls -l /dev/dri
          sudo chmod 666 /dev/dri/*
          # the KMS-emulator scenarios open a seat: embedded seatd wants a VT
          sudo chmod 666 /dev/tty[0-9]*
          vulkaninfo --summary || true

      - name: Run full test suite
        run: |
          set -o pipefail
          {
            python3 ./build -j "$(nproc)" -k imway_test &&
            python3 ./build -j "$(nproc)" -k &&
            python3 ./build -j 2 -k -Druns=1 test
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests.log" \
            --title "Tests" \
            --reproduce "./build -Druns=1 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-log
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  coverage:
    name: Coverage
    needs: tests
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the test environment
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          [ -e /dev/udmabuf ] || {
            echo "no udmabuf device; kernel config:"
            grep -i udmabuf "/boot/config-$(uname -r)" || true
            exit 1
          }
          sudo chmod 666 /dev/udmabuf
          [ -e /dev/dri ] || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vgem
          }
          sudo chmod 666 /dev/dri/*
          sudo chmod 666 /dev/tty[0-9]*

      - name: Run full test suite with coverage
        run: |
          set -o pipefail
          export CFLAGS="-fprofile-instr-generate -fcoverage-mapping -fcoverage-compilation-dir=. -fcoverage-prefix-map=$PWD=."
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fprofile-instr-generate -Wl,--build-id=sha1"
          mkdir -p "$RUNNER_TEMP/profiles"
          export LLVM_PROFILE_FILE="$RUNNER_TEMP/profiles/%b-%16m.profraw"
          {
            python3 ./build -B .build-coverage -j "$(nproc)" -k imway_test &&
            python3 ./build -B .build-coverage -j "$(nproc)" -k &&
            python3 ./build -B .build-coverage -j 2 -k -Druns=1 test &&
            bash dev/ci_coverage.sh .build-coverage "$RUNNER_TEMP/profiles"
          } 2>&1 | tee "$RUNNER_TEMP/coverage.log"

      - name: Publish coverage summary
        run: |
          {
            echo "## LLVM coverage"
            echo
            echo '```text'
            cat .coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browsable coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: .coverage/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: linux-clang
          verbose: true

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/coverage.log" \
            --title "Coverage" \
            --reproduce "./build -B .build-coverage -Druns=1 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-log
          path: ${{ runner.temp }}/coverage.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  build-asan:
    name: Build ASan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Build imway with ASan
        run: |
          set -o pipefail
          export CFLAGS="-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=address"
          python3 ./build -B .build-asan -j "$(nproc)" imway \
            2>&1 | tee "$RUNNER_TEMP/build-asan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build-asan.log" \
            --title "Build ASan" \
            --reproduce "CFLAGS/-fsanitize=address ./build -B .build-asan imway"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-asan-log
          path: ${{ runner.temp }}/build-asan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-asan:
    name: Tests ASan
    needs: [tests, build-asan]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the test environment
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          [ -e /dev/udmabuf ] || {
            echo "no udmabuf device; kernel config:"
            grep -i udmabuf "/boot/config-$(uname -r)" || true
            exit 1
          }
          sudo chmod 666 /dev/udmabuf
          [ -e /dev/dri ] || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vgem
          }
          sudo chmod 666 /dev/dri/*
          sudo chmod 666 /dev/tty[0-9]*

      - name: Run full test suite with ASan
        run: |
          set -o pipefail
          export CFLAGS="-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=address"
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          {
            python3 ./build -B .build-tests-asan -j "$(nproc)" -k imway_test &&
            python3 ./build -B .build-tests-asan -j "$(nproc)" -k &&
            python3 ./build -B .build-tests-asan -j 2 -k -Druns=1 test
          } 2>&1 | tee "$RUNNER_TEMP/tests-asan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-asan.log" \
            --title "Tests ASan" \
            --reproduce "CFLAGS/-fsanitize=address ./build -B .build-tests-asan -Druns=1 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-log
          path: ${{ runner.temp }}/tests-asan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  build-ubsan:
    name: Build UBSan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Build imway with UBSan
        run: |
          set -o pipefail
          export CFLAGS="-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=undefined"
          python3 ./build -B .build-ubsan -j "$(nproc)" imway \
            2>&1 | tee "$RUNNER_TEMP/build-ubsan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build-ubsan.log" \
            --title "Build UBSan" \
            --reproduce "CFLAGS/-fsanitize=undefined ./build -B .build-ubsan imway"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-ubsan-log
          path: ${{ runner.temp }}/build-ubsan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-ubsan:
    name: Tests UBSan
    needs: [tests, build-ubsan]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the test environment
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          [ -e /dev/udmabuf ] || {
            echo "no udmabuf device; kernel config:"
            grep -i udmabuf "/boot/config-$(uname -r)" || true
            exit 1
          }
          sudo chmod 666 /dev/udmabuf
          [ -e /dev/dri ] || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vgem
          }
          sudo chmod 666 /dev/dri/*
          sudo chmod 666 /dev/tty[0-9]*

      - name: Run full test suite with UBSan
        run: |
          set -o pipefail
          export CFLAGS="-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=undefined"
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          {
            python3 ./build -B .build-tests-ubsan -j "$(nproc)" -k imway_test &&
            python3 ./build -B .build-tests-ubsan -j "$(nproc)" -k &&
            python3 ./build -B .build-tests-ubsan -j 2 -k -Druns=1 test
          } 2>&1 | tee "$RUNNER_TEMP/tests-ubsan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-ubsan.log" \
            --title "Tests UBSan" \
            --reproduce "CFLAGS/-fsanitize=undefined ./build -B .build-tests-ubsan -Druns=1 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-ubsan-log
          path: ${{ runner.temp }}/tests-ubsan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
