            --log "$RUNNER_TEMP/coverage.log" \
            --title "Coverage 1/4" \
            --reproduce "./build -B .b-cov -Druns=1 -Dshard=1/4 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-1-log
          path: ${{ runner.temp }}/coverage.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  coverage-2:
    name: Coverage 2/4
    needs: [tests-0, tests-1, tests-2, tests-3]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the scenarios
        uses: ./.github/actions/prepare-tests

      - name: Run the test slice with coverage
        run: |
          set -o pipefail
          export CFLAGS="-fprofile-instr-generate -fcoverage-mapping -fcoverage-compilation-dir=. -fcoverage-prefix-map=$PWD=."
          export CXXFLAGS="$CFLAGS"
