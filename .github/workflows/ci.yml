          export LLVM_PROFILE_FILE="$RUNNER_TEMP/profiles/%b-%p.profraw"
          {
            python3 ./build -B .b-cov -j "$(nproc)" -k -Druns=1 -Dshard=2/4 ${TEST_FILTER:+-Dfilter=$TEST_FILTER} imway_test test &&
            python3 ./build -B .b-cov -j "$(nproc)" -k -Druns=1 -Dshard=2/4 '-Dfilter=headless_*syncobj*' -Dtest_wrap="$PWD/dev/vng_wrap.sh" test &&
            bash dev/ci_coverage.sh .b-cov "$RUNNER_TEMP/profiles"
          } 2>&1 | tee "$RUNNER_TEMP/coverage.log"

      - name: Upload the slice's tracefile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-2
          path: |
            .coverage/coverage.info
            .coverage/summary.txt
          # the report lives in a dot-directory, which is "hidden" by default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/coverage.log" \
            --title "Coverage 2/4" \
            --reproduce "./build -B .b-cov -Druns=1 -Dshard=2/4 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-2-log
          path: ${{ runner.temp }}/coverage.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  coverage-3:
    name: Coverage 3/4
    needs: [tests-0, tests-1, tests-2, tests-3]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the scenarios
        uses: ./.github/actions/prepare-tests

      - name: Run the test slice with coverage
