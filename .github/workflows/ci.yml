          set -o pipefail
          export CFLAGS="-fprofile-instr-generate -fcoverage-mapping -fcoverage-compilation-dir=. -fcoverage-prefix-map=$PWD=."
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fprofile-instr-generate -Wl,--build-id=sha1"
          mkdir -p "$RUNNER_TEMP/profiles"
          # %m is online merging: every process writes into a shared pool under a
          # lock. This suite kills compositors and clients where they stand, and one
