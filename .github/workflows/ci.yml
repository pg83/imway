name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      filter:
        description: glob restricting which test scenarios run (all when empty)
        default: ""

env:
  TEST_FILTER: ${{ inputs.filter }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Build imway
        run: |
          set -o pipefail
          python3 ./build -j "$(nproc)" imway \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build.log" \
            --title "Build" \
            --reproduce "./build imway"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests:
    name: Tests (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # the suite in four stable slices side by side: one runner took
      # twenty minutes over it
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the test environment
        run: |
          # nested user namespaces for the sndio scenario's private /var/run
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # dmabuf test buffers come from udmabuf (built into the azure
          # kernel; modprobe is the fallback for modular kernels)
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          [ -e /dev/udmabuf ] || {
            echo "no udmabuf device; kernel config:"
            grep -i udmabuf "/boot/config-$(uname -r)" || true
            exit 1
          }
          sudo chmod 666 /dev/udmabuf
          # a drm node backs dmabuf fd validation and the KMS emulator's
          # companion identity: a render node when the kernel offers one,
          # else the hypervisor's card
          sudo modprobe vgem 2>/dev/null || true
          ls -l /dev/dri
          sudo chmod 666 /dev/dri/*
          # the KMS-emulator scenarios open a seat: embedded seatd wants a VT
          sudo chmod 666 /dev/tty[0-9]*
          # the input scenario plugs virtual devices in through uinput; the
          # nodes it creates have to be openable by the runner as well, and
          # a missing uinput only makes that scenario skip
          sudo modprobe uinput 2>/dev/null || true
          [ -e /dev/uinput ] && sudo chmod 666 /dev/uinput
          printf 'KERNEL=="event*", SUBSYSTEM=="input", MODE="0666"\n' |
            sudo tee /etc/udev/rules.d/99-imway-input.rules >/dev/null
          sudo udevadm control --reload-rules 2>/dev/null || true
          # the lock screen's PAM path needs a service that exists before it
          # can get as far as asking for the password: this one asks and
          # then refuses, which is the whole conversation
          printf 'auth     required  pam_unix.so nodelay\naccount  required  pam_unix.so\n' |
            sudo tee /etc/pam.d/imway-test >/dev/null
          # and one that says yes, so the other half of the exchange runs:
          # the account check after a successful authentication, and a
          # message from the stack that is neither of the two prompts
          echo 'imway coverage stack' | sudo tee /etc/imway-test-echo >/dev/null
          printf 'auth     optional  pam_echo.so file=/etc/imway-test-echo\nauth     required  pam_permit.so\naccount  required  pam_permit.so\n' |
            sudo tee /etc/pam.d/imway-test-ok >/dev/null
          vulkaninfo --summary || true

      - name: Run full test suite
        run: |
          set -o pipefail
          {
            python3 ./build -j "$(nproc)" -k imway_test &&
            python3 ./build -j "$(nproc)" -k &&
            python3 ./build -j "$(nproc)" -k -Druns=1 -Dshard=${{ matrix.shard }}/4 ${TEST_FILTER:+-Dfilter=$TEST_FILTER} test
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests.log" \
            --title "Tests (${{ matrix.shard }}/4)" \
            --reproduce "./build -Druns=1 -Dshard=${{ matrix.shard }}/4 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-vm:
    name: Tests VM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the test environment
        run: |
          # nested user namespaces for the sndio scenario's private /var/run
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # dmabuf test buffers come from udmabuf (built into the azure
          # kernel; modprobe is the fallback for modular kernels)
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          [ -e /dev/udmabuf ] || {
            echo "no udmabuf device; kernel config:"
            grep -i udmabuf "/boot/config-$(uname -r)" || true
            exit 1
          }
          sudo chmod 666 /dev/udmabuf
          # a drm node backs dmabuf fd validation and the KMS emulator's
          # companion identity: a render node when the kernel offers one,
          # else the hypervisor's card
          sudo modprobe vgem 2>/dev/null || true
          ls -l /dev/dri
          sudo chmod 666 /dev/dri/*
          # the KMS-emulator scenarios open a seat: embedded seatd wants a VT
          sudo chmod 666 /dev/tty[0-9]*
          # the input scenario plugs virtual devices in through uinput; the
          # nodes it creates have to be openable by the runner as well, and
          # a missing uinput only makes that scenario skip
          sudo modprobe uinput 2>/dev/null || true
          [ -e /dev/uinput ] && sudo chmod 666 /dev/uinput
          printf 'KERNEL=="event*", SUBSYSTEM=="input", MODE="0666"\n' |
            sudo tee /etc/udev/rules.d/99-imway-input.rules >/dev/null
          sudo udevadm control --reload-rules 2>/dev/null || true
          # the lock screen's PAM path needs a service that exists before it
          # can get as far as asking for the password: this one asks and
          # then refuses, which is the whole conversation
          printf 'auth     required  pam_unix.so nodelay\naccount  required  pam_unix.so\n' |
            sudo tee /etc/pam.d/imway-test >/dev/null
          # and one that says yes, so the other half of the exchange runs:
          # the account check after a successful authentication, and a
          # message from the stack that is neither of the two prompts
          echo 'imway coverage stack' | sudo tee /etc/imway-test-echo >/dev/null
          printf 'auth     optional  pam_echo.so file=/etc/imway-test-echo\nauth     required  pam_permit.so\naccount  required  pam_permit.so\n' |
            sudo tee /etc/pam.d/imway-test-ok >/dev/null
          vulkaninfo --summary || true

      - name: Prepare a VM for the explicit-sync scenarios
        run: |
          # the runner's own DRM node has no timeline syncobjs; a virtme-ng
          # VM on the runner's kernel with a virtio-gpu does, and
          # dev/vng_wrap.sh runs single scenarios in one (-Dtest_wrap)
          sudo apt-get install -y -qq qemu-system-x86 "linux-modules-extra-$(uname -r)" >/dev/null
          pipx install virtme-ng >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          sudo chmod a+r "/boot/vmlinuz-$(uname -r)"

      - name: Run the explicit-sync scenarios in a VM
        run: |
          set -o pipefail
          {
            python3 ./build -j "$(nproc)" -k imway_test &&
            python3 ./build -j "$(nproc)" -k &&
            python3 ./build -j "$(nproc)" -k -Druns=1 '-Dfilter=headless_*syncobj*' -Dtest_wrap="$PWD/dev/vng_wrap.sh" test
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests.log" \
            --title "Tests VM" \
            --reproduce "./build -Druns=1 -Dfilter='headless_*syncobj*' -Dtest_wrap=dev/vng_wrap.sh test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-vm-log
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  coverage:
    name: Coverage
    needs: tests
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the test environment
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          [ -e /dev/udmabuf ] || {
            echo "no udmabuf device; kernel config:"
            grep -i udmabuf "/boot/config-$(uname -r)" || true
            exit 1
          }
          sudo chmod 666 /dev/udmabuf
          sudo modprobe vgem 2>/dev/null || true
          sudo chmod 666 /dev/dri/*
          sudo chmod 666 /dev/tty[0-9]*
          # the input scenario plugs virtual devices in through uinput; the
          # nodes it creates have to be openable by the runner as well, and
          # a missing uinput only makes that scenario skip
          sudo modprobe uinput 2>/dev/null || true
          [ -e /dev/uinput ] && sudo chmod 666 /dev/uinput
          printf 'KERNEL=="event*", SUBSYSTEM=="input", MODE="0666"\n' |
            sudo tee /etc/udev/rules.d/99-imway-input.rules >/dev/null
          sudo udevadm control --reload-rules 2>/dev/null || true
          # the lock screen's PAM path needs a service that exists before it
          # can get as far as asking for the password: this one asks and
          # then refuses, which is the whole conversation
          printf 'auth     required  pam_unix.so nodelay\naccount  required  pam_unix.so\n' |
            sudo tee /etc/pam.d/imway-test >/dev/null
          # and one that says yes, so the other half of the exchange runs:
          # the account check after a successful authentication, and a
          # message from the stack that is neither of the two prompts
          echo 'imway coverage stack' | sudo tee /etc/imway-test-echo >/dev/null
          printf 'auth     optional  pam_echo.so file=/etc/imway-test-echo\nauth     required  pam_permit.so\naccount  required  pam_permit.so\n' |
            sudo tee /etc/pam.d/imway-test-ok >/dev/null

      - name: Prepare a VM for the explicit-sync scenarios
        run: |
          # the runner's own DRM node has no timeline syncobjs; a virtme-ng
          # VM on the runner's kernel with a virtio-gpu does, and
          # dev/vng_wrap.sh runs single scenarios in one (-Dtest_wrap)
          sudo apt-get install -y -qq qemu-system-x86 "linux-modules-extra-$(uname -r)" >/dev/null
          pipx install virtme-ng >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          sudo chmod a+r "/boot/vmlinuz-$(uname -r)"

      - name: Run full test suite with coverage
        run: |
          set -o pipefail
          export CFLAGS="-fprofile-instr-generate -fcoverage-mapping -fcoverage-compilation-dir=. -fcoverage-prefix-map=$PWD=."
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fprofile-instr-generate -Wl,--build-id=sha1"
          mkdir -p "$RUNNER_TEMP/profiles"
          # %m is online merging: every process writes into a shared pool
          # under a lock. This suite kills compositors and clients where they
          # stand, and one killed mid-merge leaves an accumulator that every
          # later process merges into again. That is where the report's
          # impossible hit counts came from. One file per process instead,
          # named per scenario by dev/run_test.py, so a killed process takes
          # only its own profile down with it.
          export LLVM_PROFILE_FILE="$RUNNER_TEMP/profiles/%b-%p.profraw"
          {
            python3 ./build -B .b-cov -j "$(nproc)" -k imway_test &&
            python3 ./build -B .b-cov -j "$(nproc)" -k &&
            python3 ./build -B .b-cov -j "$(nproc)" -k -Druns=1 ${TEST_FILTER:+-Dfilter=$TEST_FILTER} test &&
            python3 ./build -B .b-cov -j "$(nproc)" -k -Druns=1 '-Dfilter=headless_*syncobj*' -Dtest_wrap="$PWD/dev/vng_wrap.sh" test &&
            bash dev/ci_coverage.sh .b-cov "$RUNNER_TEMP/profiles"
          } 2>&1 | tee "$RUNNER_TEMP/coverage.log"

      - name: Publish coverage summary
        run: |
          {
            echo "## LLVM coverage"
            echo
            echo '```text'
            cat .coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browsable coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: .coverage
          # the report lives in a dot-directory, which is "hidden" by default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          use_oidc: true
          files: .coverage/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: linux-clang
          verbose: true

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/coverage.log" \
            --title "Coverage" \
            --reproduce "./build -B .b-cov -Druns=1 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-log
          path: ${{ runner.temp }}/coverage.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  build-asan:
    name: Build ASan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Build imway with ASan
        run: |
          set -o pipefail
          export CFLAGS="-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=address"
          python3 ./build -B .build-asan -j "$(nproc)" imway \
            2>&1 | tee "$RUNNER_TEMP/build-asan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build-asan.log" \
            --title "Build ASan" \
            --reproduce "CFLAGS/-fsanitize=address ./build -B .build-asan imway"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-asan-log
          path: ${{ runner.temp }}/build-asan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-asan:
    name: Tests ASan
    needs: [tests, build-asan]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the test environment
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          [ -e /dev/udmabuf ] || {
            echo "no udmabuf device; kernel config:"
            grep -i udmabuf "/boot/config-$(uname -r)" || true
            exit 1
          }
          sudo chmod 666 /dev/udmabuf
          sudo modprobe vgem 2>/dev/null || true
          sudo chmod 666 /dev/dri/*
          sudo chmod 666 /dev/tty[0-9]*
          # the input scenario plugs virtual devices in through uinput; the
          # nodes it creates have to be openable by the runner as well, and
          # a missing uinput only makes that scenario skip
          sudo modprobe uinput 2>/dev/null || true
          [ -e /dev/uinput ] && sudo chmod 666 /dev/uinput
          printf 'KERNEL=="event*", SUBSYSTEM=="input", MODE="0666"\n' |
            sudo tee /etc/udev/rules.d/99-imway-input.rules >/dev/null
          sudo udevadm control --reload-rules 2>/dev/null || true
          # the lock screen's PAM path needs a service that exists before it
          # can get as far as asking for the password: this one asks and
          # then refuses, which is the whole conversation
          printf 'auth     required  pam_unix.so nodelay\naccount  required  pam_unix.so\n' |
            sudo tee /etc/pam.d/imway-test >/dev/null
          # and one that says yes, so the other half of the exchange runs:
          # the account check after a successful authentication, and a
          # message from the stack that is neither of the two prompts
          echo 'imway coverage stack' | sudo tee /etc/imway-test-echo >/dev/null
          printf 'auth     optional  pam_echo.so file=/etc/imway-test-echo\nauth     required  pam_permit.so\naccount  required  pam_permit.so\n' |
            sudo tee /etc/pam.d/imway-test-ok >/dev/null

      - name: Run full test suite with ASan
        run: |
          set -o pipefail
          export CFLAGS="-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=address"
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export LSAN_OPTIONS="suppressions=$PWD/dev/lsan.supp"
          # lavapipe compiles shaders through LLVM on its own worker threads,
          # whose stacks asan's inflated frames overrun: the run died with a
          # SEGV inside libLLVM on a random scenario. No extra threads, no
          # small stacks to overrun.
          export LP_NUM_THREADS=0
          {
            python3 ./build -B .b-ta -j "$(nproc)" -k imway_test &&
            python3 ./build -B .b-ta -j "$(nproc)" -k &&
            python3 ./build -B .b-ta -j "$(nproc)" -k -Druns=1 ${TEST_FILTER:+-Dfilter=$TEST_FILTER} test
          } 2>&1 | tee "$RUNNER_TEMP/tests-asan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-asan.log" \
            --title "Tests ASan" \
            --reproduce "CFLAGS/-fsanitize=address ./build -B .b-ta -Druns=1 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-log
          path: ${{ runner.temp }}/tests-asan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  build-ubsan:
