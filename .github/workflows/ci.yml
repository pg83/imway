        run: |
          set -o pipefail
          export CFLAGS="-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=undefined"
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          {
            python3 ./build -B .b-tu -j "$(nproc)" -k imway_test &&
            python3 ./build -B .b-tu -j "$(nproc)" -k &&
            python3 ./build -B .b-tu -j "$(nproc)" -k -Druns=1 ${TEST_FILTER:+-Dfilter=$TEST_FILTER} test
          } 2>&1 | tee "$RUNNER_TEMP/tests-ubsan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-ubsan.log" \
            --title "Tests UBSan" \
            --reproduce "CFLAGS/-fsanitize=undefined ./build -B .b-tu -Druns=1 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-ubsan-log
          path: ${{ runner.temp }}/tests-ubsan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
