name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      filter:
        description: glob restricting which test scenarios run (all when empty)
        default: ""

env:
  TEST_FILTER: ${{ inputs.filter }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Build imway
        run: |
          set -o pipefail
          python3 ./build -j "$(nproc)" imway \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build.log" \
            --title "Build" \
            --reproduce "./build imway"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  # Every suite runs in four stable slices side by side (build.py
  # -Dshard=K/N, a hash of the scenario name): one runner took twenty
  # minutes over all of it. The plain slices gate the coverage and
  # sanitizer ones, and each plain and coverage slice also runs its share
  # of the explicit-sync scenarios in a VM with timeline syncobjs.

  tests-0:
    name: Tests 0/4
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the scenarios
        uses: ./.github/actions/prepare-tests

      - name: Run the test slice
        run: |
          set -o pipefail
          {
            python3 ./build -j "$(nproc)" -k -Druns=1 -Dshard=0/4 ${TEST_FILTER:+-Dfilter=$TEST_FILTER} test &&
            python3 ./build -j "$(nproc)" -k -Druns=1 -Dshard=0/4 '-Dfilter=headless_*syncobj*' -Dtest_wrap="$PWD/dev/vng_wrap.sh" test
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests.log" \
            --title "Tests 0/4" \
            --reproduce "./build -Druns=1 -Dshard=0/4 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-0-log
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-1:
    name: Tests 1/4
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Prepare the runner for the scenarios
        uses: ./.github/actions/prepare-tests

      - name: Run the test slice
        run: |
          set -o pipefail
          {
            python3 ./build -j "$(nproc)" -k -Druns=1 -Dshard=1/4 ${TEST_FILTER:+-Dfilter=$TEST_FILTER} test &&
            python3 ./build -j "$(nproc)" -k -Druns=1 -Dshard=1/4 '-Dfilter=headless_*syncobj*' -Dtest_wrap="$PWD/dev/vng_wrap.sh" test
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests.log" \
            --title "Tests 1/4" \
            --reproduce "./build -Druns=1 -Dshard=1/4 test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-1-log
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-2:
    name: Tests 2/4
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
